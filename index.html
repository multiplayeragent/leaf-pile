<script>
/* ═══ LEAF PILE · a Multiplayer Agent starter ══════════════════════════════════════════
 * Rake the yard's fallen leaves into big piles, bag them for coins, and jump in the big ones.
 * Drop-in, 1–8 players; bot neighbors rake too.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ every number worth tuning: raking, piles, bags, jumps, the blower, waves, gusts, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host, live ops
 *   THE YARD ...... the yard as a grid of cells: house, trees, fence, sidewalk
 *   LEAVES ........ leaf counts on the wire (chunks), my own raking blended on top, the action stream
 *   RAKING ........ the rake, the blower, dropping, bagging, jumping (the same for players and bots)
 *   AFTERNOON (HOST) the round, leaf waves, wind gusts, piles, coins, applying everyone's actions
 *   BOTS (HOST) ... neighbors who pick a spot, rake leaves to it, bag the pile (and sometimes jump in)
 *   ME ............ my raker: walking, raking, dropping, bagging, jumping, sending my actions
 *   OTHERS ........ everyone else, eased between snapshots
 *   DRAW .......... camera, the painted yard, the leaf layer, piles, people, falling leaves, canopies, wind
 *   HUD & RESULTS . clock, coins, armful, banners, results card, leaderboard, sound
 *   INPUT ......... keys, mouse, touch stick and buttons
 *   MAIN LOOP ..... frame(), start()
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Leaves on the ground are a count per cell (0–63). The HOST owns them and publishes them in
 *     4 shared fields `g0`…`g3`, a 24×15 block each: {v, h}, one letter per cell, v goes up on
 *     every write. Only blocks that changed, at most 4 times a second.
 *   - Piles are objects, not cells: the host writes `piles` {v, n: next id, l: [[id, x×10, y×10,
 *     leaves], …]}. Bags, coins, the clock, waves and gusts live in `day` (ONE JSON field, `v` only
 *     goes up): {id, v, ph, ends, wave, gust, bagsN, sc: {id: [coins, bags, biggest jump, blower,
 *     name, color]}, res}.
 *   - Each player moves its OWN raker and rakes on its own screen at once. Every 100ms it sends
 *     the host one "act" {g: afternoon id, s: number, o: oldest unacknowledged, a: [actions]}:
 *     ["r", cell, n, …] raked, ["m", from, to, n, …] blown, ["d", x, y] dropped my armful,
 *     ["b", pile] bagged, ["j", pile] jumped in, ["u"] bought the blower. The host applies them
 *     in order (taking only leaves that are really there) and writes `ack` {player: [last number
 *     applied, armful]} after the blocks and piles that carry them. Until then my screen adds my
 *     unacknowledged actions on top of the host's state, so raked leaves never pop back. Nothing
 *     acknowledged in 2.5s (the host changed?): send it all again; the host skips any it applied.
 *   - Each player writes its OWN entity: `p` (one JSON field: position, facing, raking, armful,
 *     tool, jumping) 10 times a second, `hb` (heartbeat) once a second, `n`/`c` once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s), worked
 *     out every frame. It also runs the bots (`bots`, 10/s), the leaf waves and the gusts. A new
 *     host adopts everything from state and carries on: same afternoon, same clock, same piles.
 *   - Effects are events: "bag" and "whee" (someone jumped in a pile).
 *   - Leaderboard "most-coins": the most coins a player made in one afternoon.
 *   - Live ops: `leafScale` makes every wave bigger or smaller; events show top right.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
// Distances are in cells (a cell is about half a meter).
const CONFIG = {
  dayMs: 180000,         // one afternoon
  resultsMs: 13000,      // the results card, then the next afternoon
  seats: 4,              // bot neighbors fill the yard up to this many rakers
  speed: 4.6,            // cells per second, empty-handed
  carrySlow: 0.35,       // a full armful slows you by this share
  rakeAhead: 1.0,        // the rake's head is this far in front of you
  rakeR: 1.15,           // ... and gathers leaves within this of it
  rakeRate: 30,          // leaves per second the rake gathers while you walk (a third of it standing still)
  carryCap: 120,         // the most leaves you can carry
  mergeR: 1.9,           // drop within this of a pile and you add to it
  bagMin: 30,            // a pile needs this many leaves to bag it
  leavesPerCoin: 10,     // a bag pays a coin per this many leaves...
  bigBag: 120,           // ... and half again for a pile this big
  jumpMin: 60,           // a pile this big is worth jumping into
  jumpScatter: 0.55,     // share of the pile a jump throws back onto the lawn
  reach: 2.4,            // how close you must be to bag or jump into a pile
  blowerCost: 25,        // coins for the leaf blower (this afternoon)
  blowR: 4.5,            // the blower's reach
  blowRate: 70,          // leaves per second the blower pushes
  waveMs: 34000,         // a wave of falling leaves this often...
  waveLen: 6000,         // ... over this long...
  waveLeaves: 520,       // ... this many leaves (live config: leafScale multiplies it)
  firstWave: 14000,      // the first wave, after the start of the afternoon
  gustEvery: [26000, 36000], // ms between wind gusts
  gustWarn: 2500,        // the warning before a gust
  gustLen: 2600,         // how long it blows
  gustShare: 0.3,        // each step of a gust moves this share of every cell's leaves one cell downwind
  smallPile: 45,         // piles smaller than this lose leaves to a gust
  blanket: [2, 7],       // leaves per cell when the afternoon starts (more under the trees)
  leafScale: 1,          // live ops: multiplies every wave
  botPace: 0.85,         // bots move at this share of your speed
  sendMs: 100,           // ms between my "act" messages and my position updates
  flushMs: 250,          // ms between the host's writes of the leaf blocks
  resendMs: 2500,        // resend actions the host hasn't acknowledged after this long
  board: "most-coins",   // leaderboard name
};
const COLORS = ["#d1495b", "#3a86ff", "#2a9d8f", "#9b5de5", "#f15bb5", "#06aed5", "#8ac926", "#ff7b00", "#6d597a", "#264653"];
const BOT_NAMES = ["Maple", "Acorn", "Hazel", "Rusty", "Pip", "Willow", "Juniper", "Basil", "Clove", "Sorrel"];
const LEAF = ["#e4572e", "#f3a712", "#a8201a", "#f9c74f", "#c97b3d", "#d1495b"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'leaf-pile',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
if (ATTRACT) Object.assign(CONFIG, { seats: 6, firstWave: 600, waveMs: 20000, gustEvery: [7000, 9000], botPace: 1.05, resultsMs: 1500 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true, live: { config: {}, active: [] },
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {}, onLive() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fallback) => { if (typeof v !== "string") return fallback; try { return JSON.parse(v); } catch { return fallback; } };
const memo = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fallback); memo.set(key, { raw, v }); return v; }
const shared = (key, fallback) => parseOnce("shared:" + key, S.shared[key], fallback);
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);
const liveNum = (key, fallback, lo, hi) => { const v = Number(((net && net.live && net.live.config) || {})[key]); return Number.isFinite(v) && v > 0 ? Math.max(lo, Math.min(hi, v)) : fallback; };
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rnd = (a, b) => a + Math.random() * (b - a), pick = (l) => l[Math.floor(Math.random() * l.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

// ── THE YARD ────────────────────────────────────────────────────────────────────────
// 48×30 cells. The house along the top, four big trees (and a young one), a picket fence round
// three sides, the sidewalk and the curb along the bottom where the full bags go.
const NX = 48, NY = 30, N = NX * NY, CELL = 20;
const idx = (x, y) => y * NX + x;
const cellAt = (x, y) => idx(clamp(Math.floor(x), 0, NX - 1), clamp(Math.floor(y), 0, NY - 1));
const HOUSE = { x0: 15, y0: 0, x1: 33, y1: 5.2 };
const TREES = [{ x: 7.5, y: 9.5, r: 4.4 }, { x: 40.5, y: 9, r: 4.2 }, { x: 11.5, y: 22, r: 3.8 }, { x: 37, y: 21.5, r: 4 }, { x: 24.5, y: 14.5, r: 2.8 }]; // r: the crown (leaves fall a bit wider)
const WALK = { x0: 1.1, x1: NX - 1.1, y0: 1.1, y1: 27.6 };   // inside the fence, above the curb
const CURB_Y = 28.6;
const open = new Uint8Array(N); // 1 = leaves can lie here
for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
  const cx = x + 0.5, cy = y + 0.5, inHouse = cx > HOUSE.x0 && cx < HOUSE.x1 && cy < HOUSE.y1;
  open[idx(x, y)] = !inHouse && cx > 0.8 && cx < NX - 0.8 && cy > 0.8 && cy < 28.2 ? 1 : 0;
}
/** Keep someone out of the house, the tree trunks and the fence. */
function collide(s) {
  s.x = clamp(s.x, WALK.x0, WALK.x1); s.y = clamp(s.y, WALK.y0, WALK.y1);
  const r = 0.55, cx = clamp(s.x, HOUSE.x0, HOUSE.x1), cy = clamp(s.y, HOUSE.y0, HOUSE.y1), dx = s.x - cx, dy = s.y - cy, d = Math.hypot(dx, dy);
  if (d < r) { if (d > 1e-4) { s.x = cx + (dx / d) * r; s.y = cy + (dy / d) * r; } else s.y = HOUSE.y1 + r; }
  for (const t of TREES) { const tx = s.x - t.x, ty = s.y - t.y, td = Math.hypot(tx, ty), min = 0.75 + r; if (td < min && td > 1e-4) { s.x = t.x + (tx / td) * min; s.y = t.y + (ty / td) * min; } }
}

// ── LEAVES ──────────────────────────────────────────────────────────────────────────
// On the wire a cell is one letter: A = 0 … _ = 63. The grid is 4 chunks of 24×15 cells.
const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
const B64I = new Uint8Array(128); for (let i = 0; i < 64; i++) B64I[B64.charCodeAt(i)] = i;
const CW = 24, CH = 15, CHUNKS = 4, MAXLEAF = 63;
function eachChunkCell(k, f) { const x0 = (k % 2) * CW, y0 = Math.floor(k / 2) * CH; let n = 0; for (let y = y0; y < y0 + CH; y++) for (let x = x0; x < x0 + CW; x++) f(idx(x, y), n++); }
function encodeChunk(k, h) { let s = ""; eachChunkCell(k, (i) => { s += B64[clamp(Math.round(h[i]), 0, MAXLEAF)]; }); return s; }
const chunkV = (k) => { const c = shared("g" + k, null); return c && typeof c.v === "number" ? c.v : 0; };
const view = { q: new Uint8Array(N), raw: [] }; // the host's grid as state has it
function readChunks() {
  for (let k = 0; k < CHUNKS; k++) {
    const raw = S.shared["g" + k];
    if (raw === view.raw[k]) continue;
    view.raw[k] = raw;
    const c = parse(raw, null);
    if (c && typeof c.h === "string" && c.h.length === CW * CH) eachChunkCell(k, (i, n) => { view.q[i] = B64I[c.h.charCodeAt(n)] || 0; });
  }
}
// My actions the host hasn't acknowledged: their leaf changes are added on top of its grid on my
// screen, my dropped piles show as ghosts, piles I bagged or jumped in are hidden.
const pend = { sum: new Float32Array(N), batches: [], seq: 0, lastSend: 0, acts: [], rake: new Map(), move: new Map(), ghost: null, hide: [] };
function resetPending() { pend.sum.fill(0); pend.batches = []; pend.acts = []; pend.rake.clear(); pend.move.clear(); pend.ghost = null; pend.hide = []; }
/** The leaves on a cell as this screen should use it: the host's grid, or the shared one plus my unacknowledged changes. */
const leavesAt = (i) => (world.acting ? world.h[i] : Math.max(0, view.q[i] + pend.sum[i]));
/** How an actor changes leaves: the host straight into its grid (credited to `id`), a player through the action stream. */
function hostApi(id) {
  return {
    get: (i) => world.h[i],
    take(i, n) { const t = Math.min(n, world.h[i]); world.h[i] -= t; world.carry[id] = (world.carry[id] || 0) + t; return t; },
    move(f, t, n) { const m = Math.min(n, world.h[f], MAXLEAF - world.h[t]); world.h[f] -= m; world.h[t] += m; return m; },
    act(a) { applyAct(id, a); },
  };
}

$("again").onclick = () => { overDismissed = day()?.id ?? -1; };
// Sound: a rustle while raking (noise through a filter), and little blips. Started by the first key or tap.
let audio = null, rustle = null;
function unlockAudio() {
  if (ATTRACT) return;
  if (!audio) { try { audio = new AudioContext(); } catch { return; } }
  if (audio.state === "suspended") audio.resume();
  if (!rustle) {
    const buf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.3 ? 1 : 0.3);
    const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
    src.buffer = buf; src.loop = true; f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = 0.7; g.gain.value = 0;
    src.connect(f).connect(g).connect(audio.destination); src.start(); rustle = { f, g };
  }
}
function rustleSound(k) { if (!rustle) return; const t = audio.currentTime; rustle.g.gain.setTargetAtTime(Math.min(0.08, k * 0.045), t, 0.05); rustle.f.frequency.setTargetAtTime(k > 1 ? 900 : 2400, t, 0.1); }
function tone(freq, dur, type = "triangle", vol = 0.05, slideTo = 0, delay = 0) {
  if (!audio || ATTRACT) return;
  try { const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + delay; o.type = type; o.frequency.setValueAtTime(freq, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur); } catch {}
}
function sfx(k) {
  if (k === "cash") { tone(1320, 0.08, "square", 0.04); tone(1760, 0.16, "square", 0.04, 0, 0.08); }
  else if (k === "drop") tone(220, 0.15, "sine", 0.06, 120);
  else if (k === "whee") { tone(300, 0.35, "triangle", 0.06, 900); tone(200, 0.3, "sine", 0.05, 80, 0.32); }
  else if (k === "wave") [660, 550, 440].forEach((f, i) => tone(f, 0.18, "triangle", 0.04, 0, i * 0.12));
  else if (k === "gust") tone(180, 0.6, "sawtooth", 0.025, 90);
  else if (k === "click") tone(800, 0.05, "square", 0.03);
  else if (k === "rustle") tone(500, 0.1, "triangle", 0.02, 300);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
const input = { keys: new Set(), space: false, mouse: null, stick: null, rakeBtn: false, held: () => input.space || input.rakeBtn || !!(input.mouse && input.mouse.down) };
const KEYMAP = { arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0], arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1] };
/** A point on screen to a cell position, through the camera that drew the frame. */
const screenToWorld = (sx, sy) => ({ x: (cam.x + (sx - W / 2) / cam.z) / CELL, y: (cam.y + (sy - H / 2) / cam.z) / CELL });
function moveInput() {
  if (input.stick && input.stick.on) return { x: input.stick.dx, y: input.stick.dy };
  let x = 0, y = 0;
  for (const k of input.keys) { x += KEYMAP[k][0]; y += KEYMAP[k][1]; }
  if (!x && !y && input.mouse && input.mouse.down) { const p = screenToWorld(input.mouse.x, input.mouse.y), dx = p.x - me.x, dy = p.y - me.y, d = Math.hypot(dx, dy); if (d > 0.5) return { x: dx / d, y: dy / d }; }
  const l = Math.hypot(x, y);
  return l > 1 ? { x: x / l, y: y / l } : { x, y };
}
addEventListener("keydown", (e) => {
  unlockAudio();
  const k = e.key.toLowerCase();
  if (KEYMAP[k]) { input.keys.add(k); e.preventDefault(); }
  else if (k === " ") { e.preventDefault(); input.space = true; }
  else if (k === "e" && !e.repeat) bagMine();
  else if ((k === "q" || k === "j") && !e.repeat) jumpMine();
  else if (k === "b" && !e.repeat) toolMine();
});
addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); input.keys.delete(k); if (k === " ") input.space = false; });
addEventListener("blur", () => { input.keys.clear(); input.space = false; input.rakeBtn = false; if (input.mouse) input.mouse.down = false; input.stick = null; });
cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio();
  if (e.pointerType === "mouse") { if (e.button === 2) { bagMine(); return; } input.mouse = { x: e.clientX, y: e.clientY, down: true }; return; }
  if (!input.stick) { input.stick = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, on: false, dx: 0, dy: 0 }; try { cv.setPointerCapture(e.pointerId); } catch {} }
});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { input.mouse = { x: e.clientX, y: e.clientY, down: !!(input.mouse && input.mouse.down) }; return; }
  const s = input.stick;
  if (!s || s.id !== e.pointerId) return;
  s.x = e.clientX; s.y = e.clientY;
  let dx = s.x - s.x0, dy = s.y - s.y0, d = Math.hypot(dx, dy);
  if (d > 10) s.on = true;
  if (d > 56) { s.x0 = s.x - (dx / d) * 56; s.y0 = s.y - (dy / d) * 56; dx = s.x - s.x0; dy = s.y - s.y0; d = 56; } // the stick's base follows a long drag
  const k = Math.min(1, d / 46);
  s.dx = d ? (dx / d) * k : 0; s.dy = d ? (dy / d) * k : 0;
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => { if (e.pointerType === "mouse" && input.mouse) input.mouse.down = false; if (input.stick && input.stick.id === e.pointerId) input.stick = null; });
const rakeBtn = $("rakeBtn");
rakeBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); unlockAudio(); input.rakeBtn = true; rakeBtn.classList.add("on"); try { rakeBtn.setPointerCapture(e.pointerId); } catch {} });
for (const ev of ["pointerup", "pointercancel"]) rakeBtn.addEventListener(ev, () => { input.rakeBtn = false; rakeBtn.classList.remove("on"); });
for (const [id, act] of [["bagBtn", bagMine], ["jumpBtn", jumpMine], ["toolBtn", toolMine]]) $(id).addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); unlockAudio(); act(); });
rakeBtn.hidden = !touchUI;
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
if (ATTRACT) document.body.classList.add("attract");
if (touchUI) document.body.classList.add("touch");

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; world.acting = false; world.lastDay = null; } // woke from a freeze or a background tab: let the newer state arrive, then adopt it like a new host
  lastFrameAt = realNow;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  readChunks(); readAck();
  if (isHost()) hostTick(dt, now); else world.acting = false;
  syncViews(now);
  myTick(dt, now);
  sendActs(now); resendActs(now);
  const g = day(), t = Date.now();
  fallFx(g, t, dt); gustFx(g, t, dt); partsTick(dt);
  watchDay(now);
  if (now - lastHud > 150) { lastHud = now; hud(now); }
  draw(dt, now);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("act", (msg, from) => { if (isHost() && world.acting) onAct(from, msg); });
  net.on("bag", (m) => { if (m && typeof m.x === "number" && m.by !== me.id) bagFx(m); });
  net.on("whee", (m) => { if (m && typeof m.x === "number" && m.by !== me.id) wheeFx(m); });
  net.onDisconnect(() => { netDown = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { netDown = false; });
  net.onLive((live) => { $("event").textContent = ((live && live.active) || []).map((e) => e.title).join(" · "); });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...botColors()]);
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || pick(COLORS);
  me.x = rnd(18, 30); me.y = 24; me.startedAt = performance.now();
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
